global_costmap:
  global_frame: map
  robot_base_frame: base_link

  update_frequency: 1.0
  publish_frequency: 1.0
  static_map: true
  rolling_window: false
  track_unknown_space: true

  plugins:
    - {name: static_layer,    type: "costmap_2d::StaticLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
    - {name: social_layer,        type: "social_navigation_layers::ProximityLayer"}     # tránh người (dùng với người thật)
    - {name: keepout_layer,       type: "costmap_2d::KeepoutLayer"}                       # vùng cấm (vẽ polygon trong yaml)
    - {name: range_sensor_layer,  type: "range_sensor_layer::RangeSensorLayer"}          # thêm sonar/ultrasonic
    - {name: voxel_layer,         type: "costmap_2d::VoxelLayer"}

  static_layer:
    enabled: true
    map_topic: /map

  inflation_layer:
    enabled: true
    inflation_radius: 0.55
    cost_scaling_factor: 10.0
